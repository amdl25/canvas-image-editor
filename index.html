<!DOCTYPE html>
<html>
    <head>
        <title>Editor imagini</title>
        <link rel="stylesheet" href="style.css">
    </head>
        <body>
            <div id="canvasContainer">
                <canvas id ="canvasImagine">
                    Your browser does not support the canvas element
                </canvas>
            </div>

            <div id="CropHistogramContainer">
                <canvas id ="canvasCrop">
                    Your browser does not support the canvas element
                </canvas>
                <div id="histogramContainer">
                    <label for="canvasHistogram">Histograma</label>
                    <canvas id="canvasHistogram" label for="canvasHistogram">Histograma>
                        Your browser does not support the canvas element
                    </canvas>
                </div>
            </div>
            <div id="textForm">
                <label for="text">Text:</label>
                <input type="text" id="text" name="text" style="margin-right: 50px">
        
                <label for="dimensiune">Dimensiune:</label>
                <input type="number" id="dimensiune" name="dimensiune" style="margin-right: 50px">
        
                <label for="color">Color:</label>
                <input type="color" id="color" name="color" style="margin-right: 50px">
        
                <label for="coordinateX">Coordinate X:</label>
                <input type="number" id="coordinateX" name="coordinateX" style="margin-right: 50px">
            
                <label for="coordinateY">Coordinate Y:</label>
                <input type="number" id="coordinateY" name="coordinateY" style="margin-right: 50px">

                <button id="btnText">Adauga text</button>
            </div>

            <div id="resizeForm">
                <label for="width">Width:</label>
                <input type="number" id="width" name="width" style="margin-right: 100px">

                <label for="height">Height:</label>
                <input type="number" id="height" name="height" style="margin-right: 100px">
        
                <button id="btnScale">Schimbare dimensiune imagine</button>
            </div>

            <button id="btnStergere">Sterge selectie</button>
            
            <div id="Effects">
                <!-- data effect - atribute speciale pt a stoca datele la nivelul tag-urilor-->
                <button data-effect="grayscale">Grayscale</button>
                <button data-effect="sepia">Sepia</button>
                <button data-effect="treshold">Treshold</button>
            </div>

          
            <script src="script.js"></script>
        </body>
    
</html>
